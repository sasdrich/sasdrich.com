[module]
  [[module.imports]]
    path = 'github.com/hugomods/icons/vendors/font-awesome'
  [[module.imports]]
    path = 'github.com/hugomods/icons/vendors/simple-icons'
  [[module.imports]]
    path = 'github.com/hugomods/icons/vendors/bootstrap'
  [[module.imports]]
    path = 'hugo-book'
    # Only mount what the site uses: skip mermaid, katex and fuse.js (search is off)
    [[module.imports.mounts]]
      source = 'assets'
      target = 'assets'
    [[module.imports.mounts]]
      source = 'layouts'
      target = 'layouts'
    [[module.imports.mounts]]
      source = 'static'
      target = 'static'
      excludeFiles = ['mermaid.min.js', 'fuse.min.js', 'katex/**', 'favicon.png']

[markup.goldmark.renderer]
  unsafe = true
