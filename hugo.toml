baseURL = 'https://sasdrich.com/'
title = 'Pascal Sasdrich'

enableEmoji = true

# Set this to true if you use capital letters in file names
disablePathToLower = true

# Set this to true to enable 'Last Modified by' date and git author information
enableGitInfo = false

# Theme is intended for documentation use, therefore it doesn't render taxonomy.
disableKinds = ['taxonomy']

[params]
  # Default preview image for social media (og:image)
  images = ['images/avatar.jpg']

  # Color theme: light, dark or auto
  BookTheme = 'light'

  # Table of contents on the right side of pages (can be set per page in front matter)
  BookToC = false

  # Section of content to render as menu ("*" renders all sections)
  BookSection = '*'

  # Date format used in blog posts
  BookDateFormat = 'January 2, 2006'

  # Built-in search with flexsearch
  BookSearch = false

  # Comments template on pages
  BookComments = false

  # Experimental: portable links and link checks in markdown pages
  BookPortableLinks = false

  # Experimental: service worker for offline use
  BookServiceWorker = false

[module]
  [[module.imports]]
    path = 'github.com/hugomods/icons/vendors/font-awesome'
  [[module.imports]]
    path = 'github.com/hugomods/icons/vendors/simple-icons'
  [[module.imports]]
    path = 'github.com/hugomods/icons/vendors/bootstrap'
  [[module.imports]]
    path = 'hugo-book'

[markup.goldmark.renderer]
  unsafe = true
