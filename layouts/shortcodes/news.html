<h2 id="news">News <a class="anchor" href="#news">#</a></h2>

{{ range sort .Site.Data.news.item "date" "desc" }}
<div class="listContainer">
    <div class="listTag">{{ time.Format "Jan 2, 2006" .date }}</div>
    <div class="listElem"><b>{{ .title }}.</b> {{ .description | markdownify }}</div>
</div>
{{ end }}
